apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "oauth-apiserver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "oauth-apiserver.selectorLabels" . | nindent 4 }}
