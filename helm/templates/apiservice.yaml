kind: APIService
apiVersion: apiregistration.k8s.io/v1
metadata:
  name: v1.oauth.openshift.io
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/etcd-client-tls
spec:
  service:
    namespace: {{ .Release.Namespace }}
    name: api
    port: 443
  group: oauth.openshift.io
  version: v1
  caBundle: ""
  groupPriorityMinimum: 9900
  versionPriority: 15
