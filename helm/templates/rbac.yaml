apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oauth-apiserver.fullname" . }}
  labels:
    {{- include "oauth-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "oauth-apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
